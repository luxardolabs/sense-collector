[project]
name = "sense-collector"
# The VERSION file is the ONE version literal in the repo (repo.version_single_source) —
# hatchling reads it straight from there, so the pyproject/VERSION drift that a second
# hardcoded `version = "..."` invites cannot happen.
dynamic = ["version"]
description = "Data collection service for the Sense home energy monitor — streams the Sense cloud WebSocket/API, resolves devices, and writes energy metrics to InfluxDB."
authors = [{ name = "Luxardo Labs" }]
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.14,<4.0"

# The fleet build backend is hatchling (repo.hatchling_build_backend). Poetry remains the
# DEPENDENCY MANAGER and poetry.lock is untouched — this is a build-system change only.
# Every install path (Dockerfile, Dockerfile.test, `make poetry-install`) runs
# `poetry install --no-root`, so the backend is never exercised at image-build time.
[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Poetry runs in non-package mode: it manages dependencies, it does not build or version
# this project. Package mode would demand a `[tool.poetry] version = "..."` literal — i.e.
# exactly the second version declaration repo.version_single_source exists to prevent.
[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
httpx = {extras = ["http2"], version = "^0.28.1"}
websockets = "^16.1"
aiofiles = "^25.1.0"
influxdb-client = {extras = ["async"], version = "^1.50.0"}
python-dateutil = "^2.9.0"
pytz = "^2026.2"

# --- Transitive security floors (luxaudit) ---
# These are pulled in by influxdb-client[async] (aiohttp) and httpx[http2] (h2), whose
# ranges are unbounded above — so a plain re-lock resolves straight back to the vulnerable
# version and "re-locked = patched" is a trap. The floor has to be declared HERE, in our own
# manifest, so the lock cannot pick below the fix.
#
# aiohttp: the async transport for every InfluxDB write (InfluxDBClientAsync).
#   CVE-2026-69244 out-of-bounds heap read in the C response parser while building an error
#     message for a malformed response — reachable from a misbehaving/compromised InfluxDB.
#   CVE-2026-69243 request smuggling via WebSocket upgrades.
#   CVE-2026-59881 client decompresses RSV1 frames even when permessage-deflate was never
#     negotiated.
#   All fixed in 3.14.3.
aiohttp = ">=3.14.3"
# anyio: the async runtime underneath httpx (httpx -> httpcore -> anyio), so it is on the
#   Sense API path. CVE-2026-63374 (TLS hostname handling for internationalized domain
#   names), CVE-2026-64847 (process-pool worker stderr pipe never drained), CVE-2026-63349
#   (open_process forwards the wrong variable for extra_groups). All fixed in 4.14.2; a
#   patch bump with no API change.
anyio = ">=4.14.2"
# h2: the HTTP/2 stack behind httpx[http2], which talks to the Sense cloud API.
#   CVE-2026-71554 multiple Host headers accepted and all forwarded to the consumer, enabling
#     request smuggling where HTTP/2 is downgraded to HTTP/1.1. Fixed in 4.4.1.
h2 = ">=4.4.1"
# urllib3: the HTTP client inside influxdb-client (its sync/REST transport, imported even on the
#   async path). CVE-2026-97687 (proxy TLS settings applied to the wrong connection),
#   CVE-2026-97688 / CVE-2026-97689 (streaming API decompresses past the requested read
#   size). All fixed in 2.8.0; a minor bump with no API change.
urllib3 = ">=2.8.0"

[tool.poetry.group.dev.dependencies]
# Test tooling only. ruff/mypy and their `types-*` stubs are guard-owned: luxlint runs them
# mount-only with the fleet stubs baked in (repo.guard_owned_tools_undeclared).
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-mock = "^3.14.0"
# Measures the real suite for `make test`'s coverage floor (luxlint --coverage-ratchet).
pytest-cov = "^7.0.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Lint (ruff) + type (mypy) + test-runner (pytest) config is owned by luxlint — the canonical fleet
# configs ship in the luxlint image, byte-identical fleet-wide. This repo carries no [tool.ruff] /
# [tool.mypy] / [tool.pytest.ini_options]; that per-repo drift is exactly what luxlint's
# no_local_ruff_config / no_local_mypy_config / no_local_pytest_config flag. `make lint` runs the
# ruff+mypy checks; `make test` runs the canonical pytest config as a tail (--emit-config pytest).
# Editor parity: docker run --rm $(LUXLINT_IMAGE) --emit-config ruff > .ruff.local.toml  (gitignored)
