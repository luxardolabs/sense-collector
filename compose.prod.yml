name: sense-collector

# Prod stack (fleet standard: compose never builds — it pulls the :latest image the
# Makefile released). Config/secrets live in .env.prod (gitignored). The Dockerfile
# ships a HEALTHCHECK, so no compose-level healthcheck is needed. No host networking
# / no published ports — the collector reaches OUT to the Sense cloud + your InfluxDB.

services:
  sense-collector:
    container_name: sense-collector
    image: ${SENSE_IMAGE:-ghcr.io/luxardolabs/sense-collector:latest}
    env_file:
      - .env.prod
    restart: always
    volumes:
      - /mnt/docker/sense-collector/output:/app/output
