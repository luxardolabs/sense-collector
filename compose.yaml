name: sense-collector

# THE one compose file (fleet standard: exactly one `compose.yaml` per repo). Stacks are
# compose PROFILES — a service carrying a `profiles:` key is inert unless that profile is
# named, which is what makes one file sufficient. Compose NEVER builds: every image is built
# outside it (`make build-local`, `make harness-build`, `make release`) and run by tag.
#
# The house has TWO Sense monitors — tyle and bb — and each runs in two environments, so the
# real-account stacks are a 2x2. Every stack has its own service names, container names,
# volumes and ports, so any combination runs side by side on one host.
#
#   make dev-up      -> --profile dev-tyle    real Sense (tyle) + bundled InfluxDB + Grafana
#   make bb-up       -> --profile dev-bb      real Sense (bb)   + bundled InfluxDB + Grafana
#   make prod-up     -> --profile prod-tyle   collector only -> your external InfluxDB
#   make prod-bb-up  -> --profile prod-bb     collector only -> your external InfluxDB
#   make demo-up     -> --profile demo        FAKE Sense + bundled InfluxDB + Grafana
#   make test-e2e    -> --profile e2e         FAKE Sense + throwaway InfluxDB, no ports
#
# Credentials live in a gitignored `.env.<stack>` per stack (.env.dev-tyle, .env.dev-bb,
# .env.prod-tyle, .env.prod-bb); .env.demo and .env.e2e are committed and hold no secrets.
# Only Grafana publishes a host port — InfluxDB is reached by SERVICE NAME on the compose
# network, so it never contends for a port with a sibling fleet stack.

x-collector: &collector
  image: ${SENSE_IMAGE:-sense-collector:local}
  restart: unless-stopped

x-influx-init: &influx-init
  DOCKER_INFLUXDB_INIT_MODE: setup
  DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
  DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
  DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
  DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
  DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}

x-influx: &influx
  image: influxdb:2.7
  environment: *influx-init
  healthcheck:
    test: ["CMD", "influx", "ping"]
    interval: 5s
    timeout: 3s
    retries: 30
  restart: unless-stopped

x-grafana: &grafana
  image: grafana/grafana:11.3.0
  environment:
    GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
    GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    GF_USERS_ALLOW_SIGN_UP: "false"
    # Panel plugins the bundled dashboards use but that aren't Grafana core.
    GF_INSTALL_PLUGINS: digrich-bubblechart-panel
    INFLUX_BUCKET: ${INFLUX_BUCKET}
    INFLUX_TOKEN: ${INFLUX_TOKEN}
  restart: unless-stopped

x-prod-collector: &prod-collector
  <<: *collector
  restart: always
  healthcheck:
    test: ["CMD", "python3", "-m", "app.health.check"]
    interval: 30s
    timeout: 10s
    start_period: 30s
    retries: 3

services:
  # ══════════════════════ dev-tyle — tyle monitor, bundled infra ══════════════════════
  sense_dev_tyle_influxdb:
    <<: *influx
    profiles: [dev-tyle]
    container_name: sense_dev_tyle_influxdb
    volumes:
      - sense_dev_tyle_influxdb_data:/var/lib/influxdb2
      - ./ops/influxdb/init-dbrp.sh:/docker-entrypoint-initdb.d/init-dbrp.sh:ro

  sense_dev_tyle_grafana:
    <<: *grafana
    profiles: [dev-tyle]
    container_name: sense_dev_tyle_grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/shared-local:/var/lib/grafana/dashboards:ro
      - sense_dev_tyle_grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-13300}:3000"
    depends_on:
      sense_dev_tyle_influxdb:
        condition: service_healthy

  sense_dev_tyle_collector:
    <<: *collector
    profiles: [dev-tyle]
    container_name: sense_dev_tyle_collector
    env_file:
      - .env.dev-tyle
    environment:
      SENSE_COLLECTOR_INFLUXDB_URL: http://sense_dev_tyle_influxdb:8086
    depends_on:
      sense_dev_tyle_influxdb:
        condition: service_healthy

  # ═══════════════════════ dev-bb — bb monitor, bundled infra ═════════════════════════
  sense_dev_bb_influxdb:
    <<: *influx
    profiles: [dev-bb]
    container_name: sense_dev_bb_influxdb
    volumes:
      - sense_dev_bb_influxdb_data:/var/lib/influxdb2
      - ./ops/influxdb/init-dbrp.sh:/docker-entrypoint-initdb.d/init-dbrp.sh:ro

  sense_dev_bb_grafana:
    <<: *grafana
    profiles: [dev-bb]
    container_name: sense_dev_bb_grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/shared-local:/var/lib/grafana/dashboards:ro
      - sense_dev_bb_grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-13301}:3000"
    depends_on:
      sense_dev_bb_influxdb:
        condition: service_healthy

  sense_dev_bb_collector:
    <<: *collector
    profiles: [dev-bb]
    container_name: sense_dev_bb_collector
    env_file:
      - .env.dev-bb
    environment:
      SENSE_COLLECTOR_INFLUXDB_URL: http://sense_dev_bb_influxdb:8086
    depends_on:
      sense_dev_bb_influxdb:
        condition: service_healthy

  # ═════════════ prod-tyle / prod-bb — collector only, YOUR external InfluxDB ═════════
  # No bundled infra: these write to the InfluxDB named in their .env file, which also
  # supplies SENSE_IMAGE (a pinned version tag, never :latest).
  sense_prod_tyle_collector:
    <<: *prod-collector
    profiles: [prod-tyle]
    container_name: sense_prod_tyle_collector
    env_file:
      - .env.prod-tyle
    volumes:
      - ${OUTPUT_DIR:-/mnt/docker/sense-collector/output}:/app/output

  sense_prod_bb_collector:
    <<: *prod-collector
    profiles: [prod-bb]
    container_name: sense_prod_bb_collector
    env_file:
      - .env.prod-bb
    volumes:
      - ${OUTPUT_DIR:-/mnt/docker/sense-collector-bb/output}:/app/output

  # ═══════════════════ fake Sense endpoint — demo + e2e profiles ══════════════════════
  # Built OUTSIDE compose by `make harness-build` (compose never builds). The bare `:local`
  # tag is the sanctioned local-build form — this image is never pushed.
  sense_fake:
    profiles: [demo, e2e]
    image: ${SENSE_FAKE_IMAGE:-sense-collector-fake:local}
    container_name: sense_fake
    environment:
      SENSE_FAKE_PORT: "8080"
      SENSE_FAKE_MONITOR_ID: "${SENSE_FAKE_MONITOR_ID:-12345}"
      SENSE_FAKE_BASE_W: "${SENSE_FAKE_BASE_W:-1450}"
      SENSE_FAKE_INTERVAL: "${SENSE_FAKE_INTERVAL:-2.0}"
    restart: unless-stopped

  # ═════════════════════════════════ demo profile ═════════════════════════════════════
  # "Click go" — no Sense account, no hardware. Config in the committed .env.demo.
  sense_demo_influxdb:
    <<: *influx
    profiles: [demo]
    container_name: sense_demo_influxdb
    volumes:
      - sense_demo_influxdb_data:/var/lib/influxdb2
      - ./ops/influxdb/init-dbrp.sh:/docker-entrypoint-initdb.d/init-dbrp.sh:ro

  sense_demo_grafana:
    <<: *grafana
    profiles: [demo]
    container_name: sense_demo_grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/shared-local:/var/lib/grafana/dashboards:ro
      - sense_demo_grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-13302}:3000"
    depends_on:
      sense_demo_influxdb:
        condition: service_healthy

  sense_demo_collector:
    <<: *collector
    profiles: [demo]
    container_name: sense_demo_collector
    env_file:
      - .env.demo
    environment:
      SENSE_COLLECTOR_API_BASE_URL: http://sense_fake:8080
      SENSE_COLLECTOR_WS_BASE_URL: ws://sense_fake:8080
      SENSE_COLLECTOR_INFLUXDB_URL: http://sense_demo_influxdb:8086
    depends_on:
      sense_demo_influxdb:
        condition: service_healthy
      sense_fake:
        condition: service_started

  # ══════════════════════════════════ e2e profile ═════════════════════════════════════
  # Hardware-free end to end. No published ports (never collides, runs in CI) and the
  # InfluxDB data is THROWAWAY — tmpfs, so the image's implicit VOLUME cannot mint a fresh
  # anonymous volume per run and abandon it. Fixed test values in the committed .env.e2e.
  sense_e2e_influxdb:
    <<: *influx
    profiles: [e2e]
    container_name: sense_e2e_influxdb
    volumes:
      - ./ops/influxdb/init-dbrp.sh:/docker-entrypoint-initdb.d/init-dbrp.sh:ro
    tmpfs:
      - /var/lib/influxdb2

  sense_e2e_collector:
    <<: *collector
    profiles: [e2e]
    container_name: sense_e2e_collector
    env_file:
      - .env.e2e
    environment:
      SENSE_COLLECTOR_API_BASE_URL: http://sense_fake:8080
      SENSE_COLLECTOR_WS_BASE_URL: ws://sense_fake:8080
      SENSE_COLLECTOR_INFLUXDB_URL: http://sense_e2e_influxdb:8086
    depends_on:
      sense_e2e_influxdb:
        condition: service_healthy
      sense_fake:
        condition: service_started

volumes:
  sense_dev_tyle_influxdb_data:
  sense_dev_tyle_grafana_data:
  sense_dev_bb_influxdb_data:
  sense_dev_bb_grafana_data:
  sense_demo_influxdb_data:
  sense_demo_grafana_data:
