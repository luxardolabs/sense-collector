# Auto-load the bundled Sense Collector dashboards from grafana/shared-local
# (mounted at /var/lib/grafana/dashboards in the dev/demo stacks).
apiVersion: 1

providers:
  - name: sense-collector
    orgId: 1
    folder: Sense Collector
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
