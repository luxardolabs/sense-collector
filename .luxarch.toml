[[target]]
kind = "collector"
app = "app"
source_client = ["collector/client.py"]

# The observability overlay (obs.*) is deliberately NOT adopted. Recorded as a first-class
# disposition via exempt_reason (luxarch 0.135.0) rather than left as silent config, so
# --plan can tell "reviewed and deliberately exempt" from "nobody looked".
#
# This is a CHOICE, not a non-applicability: the maintainer confirmed the overlay is opt-in
# across kinds and can trace a collector's core + client calls, so a collector is not
# auto-N/A. We are choosing not to instrument. Evidence: there is no OpenTelemetry
# dependency (absent from pyproject.toml and poetry.lock) and none of the pack's helpers
# (create_service_span / start_as_current_span / record_exception_in_span); adopting it
# means taking on an OTel stack and a collector to export to, which this deployment does
# not have.
#
# What we do instead: the sense_o11y measurement (config.MEASUREMENT_O11Y) reports the
# collector's own operation into InfluxDB alongside the energy data and is read in Grafana,
# plus the per-area structured logging in app/utils/logging.py.
#
# Revisit when the fleet stands up an OTel collector — at that point this becomes an
# adoption task, not an exemption.
[observability]
enabled = false
exempt_reason = "headless collector with no OTel stack to export to: no opentelemetry dependency and none of the pack's span helpers. Self-reports operational metrics via the sense_o11y InfluxDB measurement (read in Grafana) plus per-area structured logging. Revisit when the fleet runs an OTel collector."
