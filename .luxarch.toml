[[target]]
kind = "collector"
app = "app"
source_client = ["collector/client.py"]

# The observability overlay (obs.*) is deliberately NOT adopted. Recorded as a first-class
# disposition via exempt_reason (luxarch 0.135.0) rather than left as silent config, so
# --plan can tell "reviewed and deliberately exempt" from "nobody looked".
#
# This is a CHOICE, not a non-applicability: the maintainer confirmed the overlay is opt-in
# across kinds and can trace a collector's core + client calls, so a collector is not
# auto-N/A. Parts of the fleet DO run it (luxwx, open-claim and www enable the overlay;
# luxanalytics, open-claim and silencetosound depend on opentelemetry), so adopting here is
# possible, not blocked — we are choosing not to.
#
# Verified evidence: no opentelemetry dependency (absent from pyproject.toml and
# poetry.lock) and none of the pack's helpers (create_service_span /
# start_as_current_span / record_exception_in_span). Instrumenting would mean adding the
# OTel client stack and export config to a headless collector whose failure modes are
# already visible in the two channels below.
#
# What we do instead: the sense_o11y measurement (config.MEASUREMENT_O11Y) reports the
# collector's own operation into InfluxDB alongside the energy data and is read in Grafana,
# plus the per-area structured logging in app/utils/logging.py.
#
# Revisit if this collector's failures stop being diagnosable from those two channels, or
# if the fleet standardises tracing across collectors — then it is an adoption task.
[observability]
enabled = false
exempt_reason = "deliberate non-adoption, not non-applicability: no opentelemetry dependency and none of the pack's span helpers, and a headless collector's failures are already diagnosable from the sense_o11y InfluxDB measurement (read in Grafana) plus per-area structured logging. Parts of the fleet do run the overlay, so this is a choice to revisit if tracing is standardised across collectors."
