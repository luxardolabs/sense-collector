name: sense-collector

# Collector-only stack (fleet standard: compose never builds — it pulls the :dev
# image the Makefile pushed, or a local build via SENSE_IMAGE). Config/secrets live
# in .env.dev (gitignored) — see .env.example. Sense is a cloud API, so no host
# networking / no published ports: the collector reaches OUT to Sense + your InfluxDB.
#   docker compose ps            # health in STATUS column
#   docker inspect sense-collector | jq '.[0].State.Health'

services:
  sense-collector:
    container_name: sense-collector
    image: ${SENSE_IMAGE:-sense-collector:local}
    env_file:
      - .env.dev
    restart: always
    healthcheck:
      test: ["CMD", "python3", "-m", "app.health.check"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    volumes:
      - /mnt/docker/sense-collector/output:/app/output
